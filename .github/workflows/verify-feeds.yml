name: Verify additional public feeds
on: [push]
permissions:
  contents: read
jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify candidate board endpoints
        run: |
          python - <<'PY'
          import urllib.request,json,concurrent.futures
          boards=['asana','okta','zscaler','elastic','snowflake','confluent','rubrik','docusign','gusto','brex']
          def check(slug):
              try:
                  with urllib.request.urlopen('https://boards-api.greenhouse.io/v1/boards/'+slug+'/jobs?content=true',timeout=12) as r: data=json.loads(r.read(12000001))
                  rows=data['jobs']
                  print(slug,len(rows),'VALID' if isinstance(rows,list) and 0<len(rows)<=1000 else 'REJECT')
              except Exception as e: print(slug,type(e).__name__,'REJECT')
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:list(pool.map(check,boards))
          PY
